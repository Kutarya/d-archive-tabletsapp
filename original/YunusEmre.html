    <style>
         :root {
            --nav: #142642;
            --nav2: #1e3757;
            --accent: #1a6dbe;
            --accentbg: #eaf4ff;
            --ink: #1b2d44;
            --muted: #64748b;
            --line: #dfe6ee;
            --bg: #f5f7fa;
            --paper: #fff;
            --radius: 13px;
            --good: #117854;
            --danger: #bd3944;
        }
        
        * {
            box-sizing: border-box;
        }
        
        html {
            font: 14px/1.45 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            color: var(--ink);
            -webkit-text-size-adjust: 100%;
        }
        
        body {
            margin: 0;
            background: var(--bg);
        }
        
        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }
        
        button {
            cursor: pointer;
        }
        
        button:disabled {
            opacity: 0.42;
            cursor: not-allowed;
        }
        
        input,
        select,
        textarea {
            width: 100%;
            min-height: 43px;
            padding: 10px 12px;
            background: #fff;
            border: 1px solid #cfd9e6;
            border-radius: 9px;
            outline: none;
        }
        
        textarea {
            min-height: 78px;
            resize: vertical;
        }
        
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px #d8eafd;
        }
        
        input[type="checkbox"] {
            min-height: 0;
            width: auto;
        }
        
        button:focus-visible {
            outline: 3px solid #83bef3;
            outline-offset: 2px;
        }
        
        .app {
            display: grid;
            grid-template-columns: 230px minmax(0, 1fr);
            min-height: 100vh;
        }
        
        .aside {
            background: var(--nav);
            color: #cedcec;
            padding: 24px 13px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        
        .logo {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 9px;
            color: #fff;
            padding: 2px 6px 18px;
        }
        
        .brand-logo {
            width: 100%;
            max-width: 190px;
            height: auto;
            display: block;
            object-fit: contain;
            border-radius: 5px;
            background: white;
            padding: 5px;
        }
        
        .company-logo-preview {
            display: block;
            width: min(250px, 100%);
            height: auto;
            object-fit: contain;
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 6px;
            background: #fff;
        }
        
        .logo strong {
            font-size: 16px;
            display: block;
            line-height: 1.1;
        }
        
        .logo small {
            font-size: 11px;
            display: block;
            color: #99b5d0;
            margin-top: 5px;
        }
        
        .nav-label {
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 1.5px;
            color: #82a3c5;
            font-weight: 750;
            padding: 17px 11px 8px;
        }
        
        .nav {
            width: 100%;
            min-height: 46px;
            background: transparent;
            border: 0;
            color: #c6d5e9;
            text-align: left;
            border-radius: 9px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 13px;
            margin-bottom: 3px;
            font-weight: 600;
        }
        
        .nav:hover,
        .nav.active {
            background: #294769;
            color: #fff;
        }
        
        .nav .glyph {
            font-size: 19px;
            width: 20px;
            text-align: center;
        }
        
        .nav-bottom {
            margin-top: auto;
            border-top: 1px solid #344e6d;
            padding-top: 15px;
            font-size: 11px;
            color: #91abc5;
            line-height: 1.6;
        }
        
        .main {
            min-width: 0;
        }
        
        .top {
            height: 69px;
            background: #fff;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(18px, 3vw, 44px);
            gap: 14px;
        }
        
        .top small {
            color: var(--muted);
        }
        
        .top .company {
            font-size: 12px;
            color: #375576;
            font-weight: 650;
        }
        
        .content {
            max-width: 1510px;
            padding: 28px clamp(16px, 3vw, 44px) 90px;
            margin: auto;
        }
        
        .head {
            display: flex;
            align-items: start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }
        
        .head h1 {
            font-size: clamp(23px, 2.4vw, 33px);
            letter-spacing: -0.8px;
            line-height: 1.16;
            margin: 0 0 8px;
        }
        
        .head p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

            flex: 1;
            min-width: 0;
            display: grid;
            gap: 3px;
        }
        
        .customer-card-identity small {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #6c8ca6;
        }
        
        .customer-card-identity strong {
            font-size: 16px;
            overflow-wrap: anywhere;
        }
        
        .customer-card-identity span {
            color: #6c7e90;
            font-size: 11px;
        }
        
        .customer-facts {
            display: grid;
            grid-template-columns: 1.25fr 1fr 1fr;
            gap: 13px;
            padding: 17px 19px;
        }
        
        .customer-facts>div {
            min-width: 0;
            display: grid;
            align-content: start;
            gap: 5px;
        }
        
        .customer-facts small {
            letter-spacing: .7px;
            color: #788b9b;
            font-weight: 800;
            font-size: 10px;
        }
        
        .customer-facts strong {
            font-size: 12px;
            font-weight: 650;
            overflow-wrap: anywhere;
        }
        
        .customer-card-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 11px 18px;
            border-top: 1px solid #ecf0f5;
        }
        
        .customer-card-toolbar .muted {
            font-size: 11px;
        }
        
        .delivery-panel {
            margin-top: 18px;
            background: #fbfdff;
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 18px;
        }
        
        .delivery-panel-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 17px;
        }
        
        .delivery-panel-heading h3 {
            margin: 0 0 3px;
            font-size: 15px;
        }
        
        .delivery-panel-heading p {
            margin: 0;
            font-size: 11px;
            color: var(--muted);
        }
        
        .delivery-address-preview {
            display: flex;
            gap: 11px;
            align-items: center;
            padding: 13px 14px;
            border-radius: 9px;
            border: 1px solid #dce7f1;
            background: white;
            margin-top: 10px;
        }
        
        .delivery-address-preview>div {
            flex: 1;
            display: grid;
            gap: 4px;
            min-width: 0;
        }
        
        .delivery-address-preview strong {
            font-size: 12px;
        }
        
        .delivery-address-preview span:not(.status-dot) {
            font-size: 11px;
            color: var(--muted);
            overflow-wrap: anywhere;
        }
        
        .picker-cover {
            padding: 18px;
            z-index: 45;
        }
        
        .customer-picker-modal {
            width: min(1040px, 100%);
            height: min(730px, calc(100dvh - 36px));
            max-height: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .picker-header {
            padding: 23px 27px 18px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            border-bottom: 1px solid var(--line);
        }
        
        .picker-header h2 {
            font-size: 23px;
            letter-spacing: -.6px;
            margin: 0 0 4px;
        }
        
        .picker-header p {
            color: var(--muted);
            font-size: 12px;
            margin: 0;
        }
        
        .picker-close {
            flex: none;
            width: 36px;
            height: 36px;
            background: #f3f6fa;
            border: 1px solid #e0e6ed;
            border-radius: 9px;
            font-size: 24px;
            line-height: 1;
        }
        
        .picker-close:hover {
            background: #e7eff7;
        }
        
        .picker-workspace {
            display: grid;
            grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
            min-height: 0;
            flex: 1;
        }
        
        .picker-list-side {
            display: flex;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
            border-right: 1px solid var(--line);
        }
        
        .picker-search-wrap {
            padding: 17px 19px 13px;
            border-bottom: 1px solid #edf1f5;
        }
        
        .picker-search-wrap label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .picker-search-box {
            position: relative;
        }
        
        .picker-search-box>span {
            position: absolute;
            top: 4px;
            left: 13px;
            font-size: 28px;
            color: #718fae;
            pointer-events: none;
        }
        
        .picker-search-box input {
            padding-left: 42px;
            border-color: #bfd1e2;
            background: #f9fbfe;
        }
        
        .picker-results-meta {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            color: #7a8a9a;
            font-size: 10px;
            margin-top: 10px;
        }
        
        .picker-results {
            overflow-y: auto;
            min-height: 0;
            flex: 1;
        }
        
        .picker-customer-row {
            display: flex;
            width: 100%;
            text-align: left;
            align-items: center;
            gap: 11px;
            padding: 12px 17px;
            border: 0;
            border-bottom: 1px solid #edf1f5;
            background: #fff;
        }
        
        .picker-customer-row:hover {
            background: #f5f9fd;
        }
        
        .picker-customer-row.active {
            background: #eaf4ff;
            box-shadow: inset 3px 0 #2374c6;
        }
        
        .picker-avatar {
            width: 37px;
            height: 37px;
            border-radius: 9px;
            font-size: 11px;
        }
        
        .picker-customer-row.active .picker-avatar {
            background: #cde6ff;
            color: #1555a2;
        }
        
        .picker-customer-copy {
            display: grid;
            gap: 3px;
            flex: 1;
            min-width: 0;
        }
        
        .picker-customer-copy strong {
            font-size: 12px;
            overflow-wrap: anywhere;
        }
        
        .picker-customer-copy small {
            font-size: 10px;
            color: #6f8499;
        }
        
        .picker-chevron {
            font-size: 21px;
            color: #9badbd;
        }
        
        .picker-add {
            border: 0;
            border-top: 1px solid var(--line);
            background: #f8fbfe;
            text-align: left;
            font-size: 12px;
            font-weight: 800;
            color: #1764ac;
            padding: 14px 20px;
        }
        
        .picker-add:hover {
            background: #eaf3ff;
        }
        
        .picker-no-results {
            padding: 28px 20px;
            text-align: center;
        }
        
        .picker-no-results p {
            font-size: 11px;
            color: var(--muted);
        }
        
        .picker-detail-side {
            background: #fbfcff;
            min-width: 0;
            overflow: auto;
        }
        
        .picker-detail-empty {
            height: 100%;
            min-height: 310px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 12px;
            padding: 25px;
        }
        
        .picker-detail-icon {
            display: grid;
            place-items: center;
            background: #eaf1f9;
            color: #477194;
            font-size: 33px;
            border-radius: 17px;
            width: 65px;
            height: 65px;
        }
        
        .picker-detail-empty h3 {
            margin: 0;
            font-size: 16px;
        }
        
        .picker-detail-empty p {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
            max-width: 280px;
        }
        
        .picker-detail-content {
            padding: 25px 26px 32px;
        }
        
        .picker-detail-overline {
            font-size: 10px;
            letter-spacing: 1.3px;
            font-weight: 800;
            color: #2776bc;
        }
        
        .picker-detail-content h3 {
            font-size: 22px;
            letter-spacing: -.5px;
            margin: 7px 0 5px;
            overflow-wrap: anywhere;
        }
        
        .picker-detail-subtitle {
            font-size: 11px;
            color: var(--muted);
            margin: 0 0 20px;
        }
        
        .picker-detail-section {
            padding-top: 15px;
            margin-top: 14px;
            border-top: 1px solid #e2eaf2;
        }
        
        .picker-section-heading {
            font-weight: 800;
            color: #2f506f;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        
        .picker-section-heading span {
            font-size: 10px;
            color: #8398aa;
        }
        
        .picker-info {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr);
            gap: 12px;
            padding: 9px 0;
            border-bottom: 1px dashed #e8edf3;
        }
        
        .picker-info:last-child {
            border: 0;
        }
        
        .picker-info>span {
            color: #788b9d;
            font-size: 11px;
        }
        
        .picker-info strong {
            font-weight: 650;
            overflow-wrap: anywhere;
            font-size: 11px;
        }
        
        .picker-delivery-item {
            display: grid;
            gap: 3px;
            border: 1px solid #e1eaf3;
            padding: 9px 11px;
            margin-top: 9px;
            background: white;
            border-radius: 8px;
        }
        
        .picker-delivery-item strong {
            font-size: 11px;
        }
        
        .picker-delivery-item small,
        .picker-detail-footnote {
            color: #7d8d9f;
            font-size: 11px;
            margin: 9px 0;
        }
        
        .picker-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 15px 24px;
            border-top: 1px solid var(--line);
        }
        
        .picker-footer>span {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #718397;
            font-size: 10px;
        }
        
        .picker-footer-actions {
            display: flex;
            gap: 9px;
        }
        
        .paper .p-header-context {
            letter-spacing: 1px;
            font-size: 9px;
            color: #666;
        }
        
        .paper .p-customer-ids {
            margin: 9px 0;
            line-height: 1.7;
        }
        
        .paper .p-delivery-separate {
            padding-top: 9px;
            margin-top: 7px;
            border-top: 1px solid #aaa;
        }
        
        .paper .p-delivery-separate>span {
            text-transform: uppercase;
            display: block;
            font-weight: 700;
            font-size: 9px;
            margin-bottom: 3px;
        }
        
        @media (max-width:760px) {
            .customer-step-head {
                flex-direction: column;
                gap: 10px;
            }
            .customer-selected-card .customer-card-head {
                flex-wrap: wrap;
            }
            .customer-facts {
                grid-template-columns: 1fr 1fr;
            }
            .picker-cover {
                padding: 8px;
            }
            .customer-picker-modal {
                height: calc(100dvh - 16px);
            }
            .picker-header {
                padding: 16px 18px 13px;
            }
            .picker-header h2 {
                font-size: 20px;
            }
            .picker-workspace {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(0, 1fr) minmax(170px, 0.85fr);
            }
            .picker-list-side {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }
            .picker-search-wrap {
                padding: 12px 14px;
            }
            .picker-customer-row {
                padding: 10px 14px;
            }
            .picker-detail-content {
                padding: 15px 18px 20px;
            }
            .picker-footer {
                padding: 11px 14px;
            }
            .picker-footer>span {
                display: none;
            }
            .picker-footer-actions {
                width: 100%;
            }
            .picker-footer-actions .btn {
                flex: 1;
            }
        }
        
        @media (max-width:420px) {
            .customer-facts {
                grid-template-columns: 1fr;
            }
            .customer-card-toolbar {
                flex-direction: column;
                align-items: flex-start;
            }
            .delivery-panel-heading {
                align-items: flex-start;
            }
            .picker-header p {
                max-width: 240px;
            }
            .picker-info {
                grid-template-columns: 85px minmax(0, 1fr);
            }
        }
        
        @media (max-width: 1200px) {
            .editor-layout {
                grid-template-columns: minmax(0, 1fr) 260px;
            }
            .content {
                padding: 23px 20px 90px;
            }
            .aside {
                width: auto;
            }
            .item-grid {
                min-width: 590px;
            }
        }
        
        @media (max-width: 990px) {
            .app {
                grid-template-columns: 70px minmax(0, 1fr);
            }
            .aside {
                padding: 19px 9px;
            }
            .logo {
                align-items: center;
                justify-content: center;
                padding: 2px 0 25px;
            }
            .logo .brand-logo {
                width: 58px;
                padding: 2px;
            }
            .logo .logo-copy,
            .nav-label,
            .nav .nav-text,
            .nav-bottom {
                display: none;
            }
            .nav {
                justify-content: center;
                padding: 12px 0;
            }
            .nav .glyph {
                font-size: 21px;
            }
            .editor-layout {
                grid-template-columns: minmax(0, 1fr) 255px;
            }
            .grid.three,
            .grid.four {
                grid-template-columns: repeat(2, 1fr);
            }
            .span3,
            .span4 {
                grid-column: span 2;
            }
            .paper {
                transform-origin: top center;
            }
        }
        
        @media (max-width: 720px) {
            .sidebar-summary {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                align-items: center;
                gap: 3px 10px;
                padding: 13px 14px !important;
            }
            .sidebar-summary .summary-kicker {
                grid-column: 1;
                grid-row: 1;
            }
            .sidebar-summary .summary-total {
                grid-column: 1;
                grid-row: 2;
                margin: 0;
                font-size: 21px;
            }
            .sidebar-summary .summary-row {
                display: none;
            }
            .sidebar-summary .summary-actions {
                grid-column: 2;
                grid-row: 1/3;
                display: grid;
                gap: 5px;
                margin: 0;
            }
            .sidebar-summary .summary-actions .btn {
                min-height: 33px;
                padding: 5px 9px;
                font-size: 10px;
            }
            .app {
                display: block;
            }
            .aside {
                display: none;
            }
            .mobile-nav {
                display: grid;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 12;
                background: #fff;
                border-top: 1px solid #dce5ee;
                grid-template-columns: repeat(5, 1fr);
                padding: 7px 3px calc(5px + env(safe-area-inset-bottom, 0px));
            }
            .mobile-nav button {
                border: 0;
                background: transparent;
                font-size: 9px;
                color: #6c7d92;
                padding: 7px 1px;
                min-height: 46px;
                font-weight: 750;
            }
            .mobile-nav button.active {
                color: #1867b6;
            }
            .mobile-nav span {
                font-size: 20px;
                display: block;
                line-height: 1.1;
                margin-bottom: 4px;
            }
            .top {
                height: 59px;
                padding: 0 16px;
            }
            .top .company {
                max-width: 170px;
                white-space: nowrap;
                text-overflow: ellipsis;
                overflow: hidden;
            }
            .content {
                padding: 20px 14px calc(108px + env(safe-area-inset-bottom, 0px));
            }
            .head {
                align-items: stretch;
            }
            .head h1 {
                font-size: 24px;
            }
            .head p {
                font-size: 12px;
            }
            .head .actions .btn {
                padding: 8px 10px;
            }
            .head {
                flex-direction: column;
                gap: 13px;
            }
            .head .actions {
                justify-content: flex-start;
            }
            .editor-layout {
                grid-template-columns: 1fr;
            }
            .sidebar-summary {
                position: static;
                order: -1;
                padding: 16px;
            }
            .summary-total {
                font-size: 23px;
            }
            .summary-actions {
                display: flex;
            }
            .summary-actions .btn {
                flex: 1;
            }
            .steps {
                gap: 2px;
                padding: 5px;
            }
            .step {
                padding: 10px 3px;
                font-size: 10px;
                display: block;
                text-align: center;
            }
            .step .circle {
                margin: 0 auto 5px;
                width: 23px;
                height: 23px;
            }
            .grid,
            .grid.three,
            .grid.four,
            .manage-layout {
                grid-template-columns: 1fr;
            }
            .span2,
            .span3,
            .span4 {
                grid-column: 1;
            }
            .products-picker {
                grid-template-columns: 1fr 1fr;
            }
            .mini-stats {
                grid-template-columns: 1fr 1fr;
            }
            .mini-stats .panel {
                padding: 14px;
            }
            .mini-stats strong {
                font-size: 19px;
            }
            .panel-pad {
                padding: 16px;
            }
            .searchbar {
                flex-wrap: wrap;
            }
            .searchbar select {
                width: 100%;
            }
            .searchbar input {
                max-width: none;
            }
            .preview-frame {
                padding: 8px;
            }
            .preview-frame .paper {
                transform: scale(0.55);
                transform-origin: top left;
                margin: 0;
                width: 210mm;
                min-height: 297mm;
            }
            .preview-frame {
                height: min(70vh, 680px);
                overflow: auto;
            }
            .toast {
                bottom: 86px;
                left: 12px;
                right: 12px;
            }
            .modal-content {
                padding: 16px;
            }
        }
        
        @media (max-width: 410px) {
            .products-picker {
                grid-template-columns: 1fr;
            }
            .top small {
                display: none;
            }
        }
        
        @media print {
            @page {
                size: A4 portrait;
                margin: 9mm 10mm 8mm;
            }
            html,
            body {
                padding: 0 !important;
                margin: 0 !important;
                background: #fff !important;
            }
            body>*:not(#print-layer) {
                display: none !important;
            }
            #print-layer {
                display: block !important;
                position: static !important;
                background: #fff !important;
                padding: 0 !important;
            }
            #print-layer .modal-head,
            #print-layer .modal-foot {
                display: none !important;
            }
            #print-layer .preview-frame {
                padding: 0 !important;
                max-height: none !important;
                height: auto !important;
                overflow: visible !important;
                background: #fff !important;
            }
            #print-layer .modal {
                box-shadow: none !important;
                border-radius: 0 !important;
                width: 100% !important;
                max-height: none !important;
                overflow: visible !important;
            }
            #print-layer .paper {
                box-shadow: none !important;
                margin: 0 !important;
                transform: none !important;
                width: 190mm !important;
                min-height: 279mm !important;
                padding: 0 !important;
                page-break-after: auto !important;
            }
            #print-layer .p-flex-space {
                min-height: 15mm;
            }
            #print-layer .lines tr {
                break-inside: avoid;
            }
            #print-layer .p-signatures,
            #print-layer .recap,
            #print-layer .p-footer,
            #print-layer .p-grid,
            #print-layer .big-total {
                break-inside: avoid;
            }
            #print-layer .lines tfoot {
                display: table-row-group;
            }
            #print-layer .preview-warning {
                display: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="app">

  function validateDoc(d, mode = "draft") {
    if (!d.number.trim()) return "Document number is required.";
    if (!d.issueDate) return "Issue date is required.";
    if (mode === "open") {
      if (!d.customerId || !db.customers.some((c) => c.id === d.customerId))
        return "Select a customer first.";
      if (!d.items.length) return "Add at least one product.";
      if (!["EUR", "CZK", "USD", "GBP"].includes(d.currency))
        return "Select a supported document currency.";
      if (num(d.exchange) <= 0) return "Enter a positive exchange rate.";
      if (
        d.items.some(
          (it) =>
            !String(it.name || "").trim() ||
            it.qty == null ||
            it.qty === "" ||
            !Number.isFinite(Number(it.qty)) ||
            num(it.qty) <= 0 ||
            it.price === null ||
            it.price === undefined ||
            it.price === "" ||
            !Number.isFinite(Number(it.price)) ||
            num(it.price) < 0 ||
            it.vat == null ||
            it.vat === "" ||

      }
      if (name === "exchange") {
        v = x.value === "" ? "" : num(v);
      }
      if (name === "status" && v === "open" && !current().customerId) {
        toast("Select customer before issuing.");
        x.value = "draft";
        return;
      }
      current()[name] = v;
      rememberWork();
      if (["shipId", "customerId"].includes(name)) {
        render();
      } else if (name === "number") {
        syncSummary();
      }
    }
  });
  document
    .getElementById("backup-upload")
    .addEventListener("change", async (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      try {
        const d = JSON.parse(await f.text());
        validateDatabase(d);
        ask(
          "Restore backup?",
          "Current local data will be replaced by the selected backup.",
          "Restore",
          () => {
            const previous = db,
              wasLocked = storageLocked;
            db = stripCatalogPrices(d);
            storageLocked = false;
            if (!persist()) {
              db = previous;
              storageLocked = wasLocked;
              return;
            }
            unreadableData = null;
            ui.draft = clone(d.workingDraft || newDraft());
            ui.page = "slips";
            ui.search = "";
            ui.step = 0;
            ui.editId = db.docs.some((doc) => doc.id === ui.draft.id)
              ? ui.draft.id
              : null;
            render();
            toast("Backup restored.");
          },
        );
      } catch (err) {
        toast("Could not restore: " + err.message);
      }
      e.target.value = "";
    });
  document
    .getElementById("xml-upload")
    .addEventListener("change", async (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      try {
        importCustomersXml(await f.text());
      } catch (err) {
        toast("XML import failed: " + err.message);
      }
      e.target.value = "";
    });
  ui.draft = clone(db.workingDraft || newDraft());
  ui.editId = db.docs.some((doc) => doc.id === ui.draft.id)
    ? ui.draft.id
    : null;
  render();
  if (!storageOk)
    document.getElementById("storage-indicator").textContent =
      "● Check local storage";
  if (storageLocked)
    toast(
      "Stored records could not be read. The original data is preserved; open Settings to export recovery data.",
    );
})();

    </script>
</body>

</html>
